name: FadeHost schema audit safety tests
on:
  pull_request:
    paths:
      - 'scripts/fadehost-schema-audit.js'
      - 'scripts/fadehost-schema-audit.test.js'
      - 'src/database-tls-policy.js'
      - 'src/transaction-safety.js'
      - 'src/diagnostic-safety.js'
      - '.github/workflows/fadehost-schema-audit-tests.yml'
  push:
    branches:
      - ops/read-only-fadehost-schema-audit
permissions:
  contents: read
jobs:
  safe-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --check scripts/fadehost-schema-audit.js
      - run: node --test scripts/fadehost-schema-audit.test.js
