name: Catalog ownership PostgreSQL
on:
  pull_request:
  push:
    branches:
      - feature/catalog-owner-adapter
permissions:
  contents: read
jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROFINO_DISPOSABLE_POSTGRES: 'yes'
      CATALOG_REHEARSAL_URL: postgresql://postgres:postgres@localhost:5432/catalog_rehearsal
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profino_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Create a separate disposable ledger test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE profino_test'
      - name: Run catalog and ledger suites without silent skips
        shell: bash
        run: |
          set -euo pipefail
          for suite in deposit-evidence-migration confirmed-deposit-posting deposit-schema-audit verified-deposit-evidence-store catalog-deposit-owner legacy-deposit-assignment-audit deposit-ownership-history-migration deposit-historical-wallet-db-inspection; do
            node --test --test-reporter=tap "src/$suite.postgres.test.js" | tee "$RUNNER_TEMP/$suite.tap"
            grep -Eq '^# tests [1-9][0-9]*$' "$RUNNER_TEMP/$suite.tap"
            grep -Fxq '# skipped 0' "$RUNNER_TEMP/$suite.tap"
          done
