name: Verify package lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify dependency lock consistency
        run: npm ci --ignore-scripts
      - name: Ensure verification did not change dependency manifests
        run: git diff --exit-code -- package.json package-lock.json
      - name: Check locked production dependencies
        run: npm audit --omit=dev --audit-level=high
