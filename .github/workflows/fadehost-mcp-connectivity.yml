name: FadeHost MCP Read-Only Connectivity Test
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/fadehost-mcp-connectivity.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/fadehost-mcp-readonly-connection') ||
      (github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/test/fadehost-mcp-readonly-connection')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only current service and capability checks
        env:
          FADEHOST_TOKEN: ${{ secrets.FADEHOST_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ.get("FADEHOST_TOKEN")
          if not token:
              raise SystemExit("FAIL: existing token unavailable")
          endpoint="https://api.fadehost.com/mcp"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          def rpc(method,params,ident):
              request=urllib.request.Request(endpoint,
                  data=json.dumps({"jsonrpc":"2.0","id":ident,"method":method,"params":params}).encode(),
                  headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json, text/event-stream"})
              try:
                  with opener.open(request,timeout=25) as response:
                      raw=response.read(2000001)
                  if len(raw)>2000000: raise ValueError()
                  body=raw.decode()
                  try: events=[json.loads(body)]
                  except json.JSONDecodeError:
                      events=[json.loads(l[6:]) for l in body.splitlines() if l.startswith("data: ")]
                  matches=[e for e in events if isinstance(e,dict) and e.get("id")==ident]
                  if len(matches)!=1 or "error" in matches[0]: raise ValueError()
                  result=matches[0].get("result")
                  if not isinstance(result,dict) or result.get("isError"): raise ValueError()
                  return result
              except Exception:
                  raise SystemExit("FAIL: MCP "+method+" unsuccessful; details withheld")
          init=rpc("initialize",{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"PROFINO read-only probe","version":"1.0"}},1)
          if not isinstance(init.get("protocolVersion"),str): raise SystemExit("FAIL: initialization")
          print("PASS: authenticated initialization")
          tools=rpc("tools/list",{},2).get("tools")
          if not isinstance(tools,list): raise SystemExit("FAIL: tool discovery")
          names={t.get("name") for t in tools if isinstance(t,dict)}
          for name in ("list_bots","get_bot","get_app","get_app_deployment","list_app_deployments","list_app_schedules","list_backups","run_app_command","list_databases","get_database","list_private_networks"):
              print("Capability",name+":",name in names)
          if "list_bots" not in names: raise SystemExit("FAIL: inventory unavailable")
          result=rpc("tools/call",{"name":"list_bots","arguments":{}},3)
          payload=result.get("structuredContent")
          if payload is None:
              for item in result.get("content",[]):
                  if isinstance(item,dict) and item.get("type")=="text":
                      try: payload=json.loads(item.get("text",""));break
                      except (ValueError,TypeError): pass
          bots=payload.get("bots",[]) if isinstance(payload,dict) else payload if isinstance(payload,list) else []
          matches=[b for b in bots if isinstance(b,dict) and b.get("name")=="telegram-bot"]
          if len(matches)!=1: raise SystemExit("FAIL: target service not uniquely identified")
          print("PASS: existing bot identified")
          print("Bot running:",matches[0].get("status")=="running")
          for key in ("plan","tier","plan_name"):
              v=matches[0].get(key)
              if isinstance(v,str) and v.lower() in ("free","starter","pro","trial"):
                  print("Service plan:",v.lower())
          print("Service plan field recognized:",any(isinstance(matches[0].get(k),str) and matches[0][k].lower() in ("free","starter","pro","trial") for k in ("plan","tier","plan_name")))
          bot_id=matches[0].get("id")
          if not isinstance(bot_id,str) or not bot_id.startswith("bot_"):
              raise SystemExit("FAIL: service identifier unavailable")
          # Query only an explicitly discovered, service-scoped read-only detail
          # method with a single recognized required string identifier.
          service_details=[matches[0]]
          for method in ("get_bot","get_app"):
              spec=[t for t in tools if isinstance(t,dict) and t.get("name")==method]
              if len(spec)!=1: continue
              contract=spec[0].get("inputSchema",{})
              props=contract.get("properties",{})
              required=contract.get("required",[])
              if not isinstance(props,dict) or not isinstance(required,list): continue
              desc=str(spec[0].get("description","")).lower()
              if any(word in desc for word in ("paid plan","requires starter","upgrade required","paid tier","additional charge","billable")):
                  print("Scoped service detail",method+": paid restriction; not attempted")
                  continue
              allowed=("app","app_id","appId","bot","bot_id","botId","id")
              if len(required)!=1 or required[0] not in allowed or not isinstance(props.get(required[0]),dict) or props[required[0]].get("type")!="string":
                  print("Scoped service detail",method+": unsupported contract")
                  continue
              try:
                  detail=rpc("tools/call",{"name":method,"arguments":{required[0]:bot_id}},9 if method=="get_bot" else 10)
              except SystemExit:
                  print("Scoped service detail",method+": unsuccessful")
                  continue
              obj=detail.get("structuredContent")
              if obj is None:
                  for part in detail.get("content",[]):
                      if isinstance(part,dict) and part.get("type")=="text":
                          try: obj=json.loads(part.get("text",""));break
                          except (ValueError,TypeError): pass
              if isinstance(obj,dict):
                  possible=[obj]+[obj[k] for k in ("bot","app","data") if isinstance(obj.get(k),dict)]
                  valid=[v for v in possible if v.get("id")==bot_id and v.get("name")=="telegram-bot"]
                  if len(valid)==1:
                      service_details.append(valid[0])
                      print("Scoped service detail",method+": confirmed")
                  else:
                      print("Scoped service detail",method+": identity unconfirmed")
          for method in ("list_app_deployments","list_app_schedules"):
              if method not in names:
                  print("Read-only access",method+": unavailable")
                  continue
              result=rpc("tools/call",{"name":method,"arguments":{"app":bot_id}},4 if method=="list_app_deployments" else 5)
              print("Read-only access",method+": confirmed")
              value=result.get("structuredContent")
              if value is None:
                  for item in result.get("content",[]):
                      if isinstance(item,dict) and item.get("type")=="text":
                          try: value=json.loads(item.get("text",""));break
                          except (ValueError,TypeError): pass
              if isinstance(value,dict):
                  key="deployments" if method=="list_app_deployments" else "schedules"
                  value=value.get(key)
              if isinstance(value,list):
                  print("Inventory count",method+":",len(value))
                  if method=="list_app_deployments" and value:
                      # Match only the known main revision; never expose deployment metadata.
                      def revision_match(v):
                          if isinstance(v,str): return v in ("e0d7509","e0d7509b43605493beb6a20485d5d17ce0ef8e16")
                          if isinstance(v,dict): return any(revision_match(x) for x in v.values())
                          if isinstance(v,list): return any(revision_match(x) for x in v)
                          return False
                      print("Known main revision in deployment inventory:",revision_match(value))
                      # Inventory membership alone is not a running revision.
                      # Only use explicit current/active deployment identifiers,
                      # and never print provider IDs, commit values or raw metadata.
                      refs={detail[k] for detail in service_details for k in ("current_deployment_id","currentDeploymentId","active_deployment_id","activeDeploymentId") if isinstance(detail.get(k),str) and detail[k]}
                      for detail in service_details:
                          for k in ("current_deployment","currentDeployment","active_deployment","activeDeployment"):
                              item=detail.get(k)
                              if isinstance(item,dict) and isinstance(item.get("id"),str) and item["id"]:
                                  refs.add(item["id"])
                      # Explicit boolean active/current flags are diagnostic only:
                      # do not equate successful historical builds with running code.
                      flagged=[d for d in value if isinstance(d,dict) and any(d.get(k) is True for k in ("is_active","isActive","is_current","isCurrent"))]
                      print("Deployment rows with explicit active/current flag:",len(flagged))
                      print("Explicit service deployment reference count:",len(refs))
                      active=[d for d in value if isinstance(d,dict) and isinstance(d.get("id"),str) and d["id"] in refs]
                      known={"e0d7509","e0d7509b43605493beb6a20485d5d17ce0ef8e16"}
                      print("Explicit active deployment resolved:",len(refs)==1 and len(active)==1)
                      if len(refs)==1 and len(active)==1:
                          item=active[0]
                          revisions={item[k] for k in ("commit_sha","commitSha","git_commit_sha","gitCommitSha","revision","sha") if isinstance(item.get(k),str) and item[k]}
                          commit=item.get("commit")
                          if isinstance(commit,dict) and isinstance(commit.get("sha"),str) and commit["sha"]:
                              revisions.add(commit["sha"])
                          print("Active deployment revision field recognized:",bool(revisions))
                          print("Active deployment matches known main:",bool(revisions) and revisions.issubset(known))
                      else:
                          print("Active deployment revision: unverified")
                  if method=="list_app_schedules":
                      print("Schema audit schedule present:",any(isinstance(v,dict) and v.get("command")=="node scripts/fadehost-schema-audit.js" for v in value))
              else:
                  print("Inventory structure",method+": unconfirmed")
          # Read-only diagnostics: never print raw configuration, IPs, or logs.
          if "get_app_firewall" in names:
              result=rpc("tools/call",{"name":"get_app_firewall","arguments":{"app":bot_id}},6)
              print("Read-only firewall access: confirmed")
              value=result.get("structuredContent")
              if value is None:
                  for item in result.get("content",[]):
                      if isinstance(item,dict) and item.get("type")=="text":
                          try: value=json.loads(item.get("text",""));break
                          except (ValueError,TypeError): pass
              if isinstance(value,dict):
                  policy=value.get("policy")
                  if isinstance(policy,str) and policy.lower() in ("allow","deny","allowlist","denylist","open","closed","public","private","allow_all","deny_all"):
                      print("Recognized firewall policy:",policy.lower())
                  else:
                      print("Firewall policy interpretation: unconfirmed")
              else:
                  print("Firewall policy interpretation: unconfirmed")
          if "get_bot_logs" in names:
              result=rpc("tools/call",{"name":"get_bot_logs","arguments":{"bot":bot_id}},7)
              print("Read-only runtime log access: confirmed")
              def strings(value):
                  if isinstance(value,str): yield value
                  elif isinstance(value,dict):
                      for v in value.values(): yield from strings(v)
                  elif isinstance(value,list):
                      for v in value: yield from strings(v)
              logs="\n".join(strings(result))
              for label,marker in (
                  ("Database connection marker","PostgreSQL connected successfully"),
                  ("Telegram polling marker","Telegram polling is active"),
                  ("HTTP listener marker","HTTP endpoints listening"),
                  ("Startup report marker","startup report delivered"),
                  ("Database idle error marker","idle PostgreSQL"),
                  ("Syntax error marker","SyntaxError")):
                  print("Historical log",label+":",marker in logs)
          # Command execution is paid-restricted. Keep this probe strictly
          # inventory-only: never execute, create, download or restore backups.
          print("Schema audit execution: disabled after confirmed paid restriction")
          specs=[t for t in tools if isinstance(t,dict) and t.get("name")=="list_backups"]
          if len(specs)!=1:
              print("Backup inventory: unavailable")
          else:
              spec=specs[0]
              schema=spec.get("inputSchema",{})
              props=schema.get("properties",{})
              required=set(schema.get("required",[]))
              description=str(spec.get("description","")).lower()
              if any(word in description for word in ("paid plan","requires starter","upgrade required","paid tier","additional charge","billable")):
                  print("Backup inventory: paid restriction; not attempted")
              elif not isinstance(props,dict):
                  print("Backup inventory: invalid tool contract")
              else:
                  # Accept only a single explicit existing-service identifier.
                  # No account-wide enumeration and no guessing database IDs.
                  identifiers=[k for k in ("app","app_id","appId","bot","bot_id","botId") if k in props and isinstance(props[k],dict) and props[k].get("type")=="string"]
                  print("Backup service identifier field recognized:",len(identifiers)==1)
                  print("Backup requires other fields:",bool(required-set(identifiers)))
                  # Only allowlisted schema field names, never parameter values,
                  # descriptions, defaults, resource identifiers or raw metadata.
                  allowed_fields={"app","app_id","appId","bot","bot_id","botId","database","database_id","databaseId","resource","resource_id","resourceId","resource_type","resourceType","type","id","project","project_id","projectId"}
                  print("Recognized required backup fields:",",".join(sorted(required&allowed_fields)) or "none")
                  print("Other required backup field count:",len(required-allowed_fields))
                  try:
                      if len(identifiers)!=1 or required-set(identifiers):
                          raise SystemExit("Unsupported scoped inventory contract")
                      result=rpc("tools/call",{"name":"list_backups","arguments":{identifiers[0]:bot_id}},8)
                  except SystemExit:
                      print("Backup inventory: request unsuccessful; no retry")
                  else:
                      print("Backup inventory: service-scoped access confirmed")
                      value=result.get("structuredContent")
                      if value is None:
                          for item in result.get("content",[]):
                              if isinstance(item,dict) and item.get("type")=="text":
                                  try: value=json.loads(item.get("text",""));break
                                  except (ValueError,TypeError):pass
                      if isinstance(value,dict):value=value.get("backups")
                      if isinstance(value,list) and all(isinstance(v,dict) for v in value):
                          print("Backup inventory count:",len(value))
                          # Never print filenames, identifiers, paths or contents.
                          print("Backup records with recognized success status:",sum(isinstance(v.get("status"),str) and v["status"].lower() in ("ready","completed","success","available") for v in value))
                      else:
                          print("Backup inventory structure: unconfirmed")
          print("Database-specific backup and independent restoration: unverified")
          PY
      - name: Verify public readiness using the existing monitor HTTP client
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          root_status="$(curl --silent --max-time 15 --output /dev/null --write-out '%{http_code}' 'https://telegram-bot-d23e.fadehost.app')" || { echo "FAIL: root transport"; exit 1; }
          health_status="$(curl --silent --max-time 15 --max-filesize 65536 --output "$response" --write-out '%{http_code}' 'https://telegram-bot-d23e.fadehost.app/healthz')" || { echo "FAIL: health transport"; exit 1; }
          echo "Root HTTP status: $root_status"
          echo "Health HTTP status: $health_status"
          if [ "$root_status" != 200 ] || [ "$health_status" != 200 ]; then
            echo "FAIL: public HTTP readiness; body withheld"
            exit 1
          fi
          python3 - "$response" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1],encoding="utf-8") as f:
                  state=json.load(f)
              if not isinstance(state,dict): raise ValueError()
              expected={"database":"connected","telegram":"connected","telegramApi":"connected","telegramReceiver":"active"}
              for key,value in expected.items():
                  print("Health",key+":",state.get(key)==value)
              print("Health ready:",state.get("ready") is True)
              if state.get("ready") is not True or not all(state.get(k)==v for k,v in expected.items()):
                  raise ValueError()
              print("PASS: public readiness contract confirmed")
          except (ValueError,TypeError,OSError):
              raise SystemExit("FAIL: health JSON contract not satisfied; body withheld")
          PY
