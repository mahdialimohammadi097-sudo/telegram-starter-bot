name: FadeHost MCP Read-Only Connectivity Test
on:
  push:
    branches: [test/fadehost-mcp-readonly-connection]
    paths: [.github/workflows/fadehost-mcp-connectivity.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/fadehost-mcp-connectivity.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/fadehost-mcp-readonly-connection') ||
      (github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/test/fadehost-mcp-readonly-connection')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only current service and capability checks
        env:
          FADEHOST_TOKEN: ${{ secrets.FADEHOST_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ.get("FADEHOST_TOKEN")
          if not token:
              raise SystemExit("FAIL: existing token unavailable")
          endpoint="https://api.fadehost.com/mcp"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          def rpc(method,params,ident):
              request=urllib.request.Request(endpoint,
                  data=json.dumps({"jsonrpc":"2.0","id":ident,"method":method,"params":params}).encode(),
                  headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json, text/event-stream"})
              try:
                  with opener.open(request,timeout=25) as response:
                      raw=response.read(2000001)
                  if len(raw)>2000000: raise ValueError()
                  body=raw.decode()
                  try: events=[json.loads(body)]
                  except json.JSONDecodeError:
                      events=[json.loads(l[6:]) for l in body.splitlines() if l.startswith("data: ")]
                  matches=[e for e in events if isinstance(e,dict) and e.get("id")==ident]
                  if len(matches)!=1 or "error" in matches[0]: raise ValueError()
                  result=matches[0].get("result")
                  if not isinstance(result,dict) or result.get("isError"): raise ValueError()
                  return result
              except Exception:
                  raise SystemExit("FAIL: MCP "+method+" unsuccessful; details withheld")
          init=rpc("initialize",{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"PROFINO read-only probe","version":"1.0"}},1)
          if not isinstance(init.get("protocolVersion"),str): raise SystemExit("FAIL: initialization")
          print("PASS: authenticated initialization")
          tools=rpc("tools/list",{},2).get("tools")
          if not isinstance(tools,list): raise SystemExit("FAIL: tool discovery")
          names={t.get("name") for t in tools if isinstance(t,dict)}
          for name in ("list_bots","list_app_deployments","list_app_schedules","list_backups","run_app_command","list_databases","get_database","list_private_networks"):
              print("Capability",name+":",name in names)
          if "list_bots" not in names: raise SystemExit("FAIL: inventory unavailable")
          result=rpc("tools/call",{"name":"list_bots","arguments":{}},3)
          payload=result.get("structuredContent")
          if payload is None:
              for item in result.get("content",[]):
                  if isinstance(item,dict) and item.get("type")=="text":
                      try: payload=json.loads(item.get("text",""));break
                      except (ValueError,TypeError): pass
          bots=payload.get("bots",[]) if isinstance(payload,dict) else payload if isinstance(payload,list) else []
          matches=[b for b in bots if isinstance(b,dict) and b.get("name")=="telegram-bot"]
          if len(matches)!=1: raise SystemExit("FAIL: target service not uniquely identified")
          print("PASS: existing bot identified")
          print("Bot running:",matches[0].get("status")=="running")
          for key in ("plan","tier","plan_name"):
              v=matches[0].get(key)
              if isinstance(v,str) and v.lower() in ("free","starter","pro","trial"):
                  print("Service plan:",v.lower())
          print("Service plan field recognized:",any(isinstance(matches[0].get(k),str) and matches[0][k].lower() in ("free","starter","pro","trial") for k in ("plan","tier","plan_name")))
          bot_id=matches[0].get("id")
          if not isinstance(bot_id,str) or not bot_id.startswith("bot_"):
              raise SystemExit("FAIL: service identifier unavailable")
          for method in ("list_app_deployments","list_app_schedules"):
              if method not in names:
                  print("Read-only access",method+": unavailable")
                  continue
              result=rpc("tools/call",{"name":method,"arguments":{"app":bot_id}},4 if method=="list_app_deployments" else 5)
              print("Read-only access",method+": confirmed")
              value=result.get("structuredContent")
              if value is None:
                  for item in result.get("content",[]):
                      if isinstance(item,dict) and item.get("type")=="text":
                          try: value=json.loads(item.get("text",""));break
                          except (ValueError,TypeError): pass
              if isinstance(value,dict):
                  key="deployments" if method=="list_app_deployments" else "schedules"
                  value=value.get(key)
              if isinstance(value,list):
                  print("Inventory count",method+":",len(value))
                  if method=="list_app_deployments" and value:
                      # Match only the known main revision; never expose deployment metadata.
                      def revision_match(v):
                          if isinstance(v,str): return v in ("e0d7509","e0d7509b43605493beb6a20485d5d17ce0ef8e16")
                          if isinstance(v,dict): return any(revision_match(x) for x in v.values())
                          if isinstance(v,list): return any(revision_match(x) for x in v)
                          return False
                      print("Known main revision in deployment inventory:",revision_match(value))
                  if method=="list_app_schedules":
                      print("Schema audit schedule present:",any(isinstance(v,dict) and v.get("command")=="node scripts/fadehost-schema-audit.js" for v in value))
              else:
                  print("Inventory structure",method+": unconfirmed")
          # Read-only diagnostics: never print raw configuration, IPs, or logs.
          if "get_app_firewall" in names:
              result=rpc("tools/call",{"name":"get_app_firewall","arguments":{"app":bot_id}},6)
              print("Read-only firewall access: confirmed")
              value=result.get("structuredContent")
              if value is None:
                  for item in result.get("content",[]):
                      if isinstance(item,dict) and item.get("type")=="text":
                          try: value=json.loads(item.get("text",""));break
                          except (ValueError,TypeError): pass
              if isinstance(value,dict):
                  policy=value.get("policy")
                  if isinstance(policy,str) and policy.lower() in ("allow","deny","allowlist","denylist","open","closed","public","private","allow_all","deny_all"):
                      print("Recognized firewall policy:",policy.lower())
                  else:
                      print("Firewall policy interpretation: unconfirmed")
              else:
                  print("Firewall policy interpretation: unconfirmed")
          if "get_bot_logs" in names:
              result=rpc("tools/call",{"name":"get_bot_logs","arguments":{"bot":bot_id}},7)
              print("Read-only runtime log access: confirmed")
              def strings(value):
                  if isinstance(value,str): yield value
                  elif isinstance(value,dict):
                      for v in value.values(): yield from strings(v)
                  elif isinstance(value,list):
                      for v in value: yield from strings(v)
              logs="\n".join(strings(result))
              for label,marker in (
                  ("Database connection marker","PostgreSQL connected successfully"),
                  ("Telegram polling marker","Telegram polling is active"),
                  ("HTTP listener marker","HTTP endpoints listening"),
                  ("Startup report marker","startup report delivered"),
                  ("Database idle error marker","idle PostgreSQL"),
                  ("Syntax error marker","SyntaxError")):
                  print("Historical log",label+":",marker in logs)
          # A single fixed, already-deployed read-only diagnostic. No upgrade or
          # schedule creation, no secret printing, no arbitrary commands.
          # Only the PR synchronize event may execute it (not the push duplicate).
          if os.environ.get("GITHUB_EVENT_NAME")=="pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8") as event:
                  action=json.load(event).get("action")
              if action=="synchronize":
                  specs=[t for t in tools if isinstance(t,dict) and t.get("name")=="run_app_command"]
                  if len(specs)!=1:
                      print("Schema audit execution: tool unavailable")
                  else:
                      spec=specs[0]
                      schema=spec.get("inputSchema",{})
                      props=schema.get("properties",{})
                      description=str(spec.get("description","")).lower()
                      if any(word in description for word in ("paid plan","requires starter","upgrade required","paid tier","additional charge","billable")):
                          print("Schema audit execution: paid restriction; not attempted")
                      elif set(schema.get("required",[])) - {"app","command"} or not {"app","command"} <= set(props):
                          print("Schema audit execution: tool contract not confirmed")
                      else:
                          # The only permitted call is the checked existing script.
                          # Tool errors may include provider text; never print it.
                          try:
                              result=rpc("tools/call",{"name":"run_app_command","arguments":{"app":bot_id,"command":"node scripts/fadehost-schema-audit.js"}},8)
                          except SystemExit:
                              print("Schema audit execution: command rejected or transport failed; no retry")
                          else:
                              print("Schema audit execution: tool returned")
                              allowed={
                                  "users.id","users.status","wallets.id","wallets.wallet_address","wallets.chain_id","wallets.network","wallets.status","wallets.wallet_type","wallets.is_platform_controlled",
                                  "user_wallet_assignments.id","user_wallet_assignments.user_id","user_wallet_assignments.wallet_id","user_wallet_assignments.assignment_type","user_wallet_assignments.status","user_wallet_assignments.ended_at",
                                  "ledger_accounts.id","ledger_accounts.user_id","ledger_accounts.account_type","ledger_accounts.currency",
                                  "ledger_transactions.id","ledger_transactions.idempotency_key","ledger_transactions.status","ledger_transactions.transaction_type","ledger_transactions.reference_id",
                                  "ledger_entries.transaction_id","ledger_entries.account_id","ledger_entries.entry_type","ledger_entries.amount","ledger_entries.currency",
                                  "verified_deposit_evidence.event_key","verified_deposit_evidence.block_hash","verified_deposit_evidence.block_number","verified_deposit_evidence.token_contract","verified_deposit_evidence.deposit_address","verified_deposit_evidence.amount_base_units",
                                  "unique:verified_deposit_evidence.event_key","unique:ledger_transactions.idempotency_key"}
                              def audit_records(value,depth=0):
                                  if depth>8:return
                                  if isinstance(value,dict):
                                      if value.get("audit")=="fadehost-schema": yield value
                                      else:
                                          for v in value.values():yield from audit_records(v,depth+1)
                                  elif isinstance(value,list):
                                      for v in value:yield from audit_records(v,depth+1)
                                  elif isinstance(value,str):
                                      for line in value.splitlines():
                                          try: parsed=json.loads(line)
                                          except (ValueError,TypeError):continue
                                          if isinstance(parsed,(dict,list)):yield from audit_records(parsed,depth+1)
                              records=list(audit_records(result))
                              if len(records)==1:
                                  record=records[0]
                                  missing=record.get("missing")
                                  ready=record.get("ready")
                                  if isinstance(ready,bool) and isinstance(missing,list) and all(isinstance(x,str) and x in allowed for x in missing) and len(missing)==len(set(missing)) and ready==(len(missing)==0):
                                      print("Schema audit result verified: true")
                                      print("Schema audit structural ready:",ready)
                                      print("Schema audit missing count:",len(missing))
                                      for item in sorted(missing):print("Schema audit missing:",item)
                                  elif record.get("error") in ("DATABASE_URL_NOT_CONFIGURED","READ_ONLY_AUDIT_FAILED") and ready is False:
                                      print("Schema audit returned recognized failure:",record["error"])
                                  else: print("Schema audit output: unconfirmed")
                              else:
                                  print("Schema audit output: unconfirmed (no unique sanitized result)")
          PY
      - name: Verify public readiness using the existing monitor HTTP client
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          root_status="$(curl --silent --max-time 15 --output /dev/null --write-out '%{http_code}' 'https://telegram-bot-d23e.fadehost.app')" || { echo "FAIL: root transport"; exit 1; }
          health_status="$(curl --silent --max-time 15 --max-filesize 65536 --output "$response" --write-out '%{http_code}' 'https://telegram-bot-d23e.fadehost.app/healthz')" || { echo "FAIL: health transport"; exit 1; }
          echo "Root HTTP status: $root_status"
          echo "Health HTTP status: $health_status"
          if [ "$root_status" != 200 ] || [ "$health_status" != 200 ]; then
            echo "FAIL: public HTTP readiness; body withheld"
            exit 1
          fi
          python3 - "$response" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1],encoding="utf-8") as f:
                  state=json.load(f)
              if not isinstance(state,dict): raise ValueError()
              expected={"database":"connected","telegram":"connected","telegramApi":"connected","telegramReceiver":"active"}
              for key,value in expected.items():
                  print("Health",key+":",state.get(key)==value)
              print("Health ready:",state.get("ready") is True)
              if state.get("ready") is not True or not all(state.get(k)==v for k,v in expected.items()):
                  raise ValueError()
              print("PASS: public readiness contract confirmed")
          except (ValueError,TypeError,OSError):
              raise SystemExit("FAIL: health JSON contract not satisfied; body withheld")
          PY
