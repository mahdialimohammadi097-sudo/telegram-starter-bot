name: FadeHost MCP Read-Only Connectivity Test

on:
  push:
    branches:
      - test/fadehost-mcp-readonly-connection
    paths:
      - .github/workflows/fadehost-mcp-connectivity.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fadehost-mcp-connectivity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify FadeHost MCP initialize (no server changes)
        shell: bash
        env:
          FADEHOST_TOKEN: ${{ secrets.FADEHOST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FADEHOST_TOKEN:-}" ]; then
            echo "::error::FADEHOST_TOKEN secret is missing or empty."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --max-time 25 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST 'https://api.fadehost.com/mcp' \
            --header "Authorization: Bearer ${FADEHOST_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"PROFINO GitHub connectivity check","version":"1.0"}}}' \
            )" || { echo "::error::Could not reach FadeHost MCP."; exit 1; }
          echo "FadeHost MCP HTTP status: $http_status"
          if [ "$http_status" != "200" ]; then
            echo "::error::MCP initialize failed (HTTP $http_status). Response withheld to protect sensitive data."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              body = f.read()
          messages = []
          try:
              messages.append(json.loads(body))
          except json.JSONDecodeError:
              for line in body.splitlines():
                  if line.startswith("data: "):
                      try:
                          messages.append(json.loads(line[6:]))
                      except json.JSONDecodeError:
                          pass
          if any(isinstance(msg, dict) and msg.get("id") == 1 and isinstance(msg.get("result"), dict) and "protocolVersion" in msg["result"] for msg in messages):
              print("PASS: FadeHost MCP authenticated and initialized successfully (read-only handshake).")
          else:
              print("FAIL: No valid MCP initialize response. Response content withheld.")
              sys.exit(1)
          PY

      - name: Discover available FadeHost read-only tools (names only)
        shell: bash
        env:
          FADEHOST_TOKEN: ${{ secrets.FADEHOST_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 25 --output "$response_file" --write-out '%{http_code}' \
            --request POST 'https://api.fadehost.com/mcp' \
            --header "Authorization: Bearer ${FADEHOST_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')" || { echo "::error::FadeHost tools/list request failed."; exit 1; }
          echo "FadeHost tools/list HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Tool discovery returned HTTP $status (response withheld)."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json, sys
          body = open(sys.argv[1], encoding="utf-8").read()
          messages = []
          try:
              messages.append(json.loads(body))
          except json.JSONDecodeError:
              for line in body.splitlines():
                  if line.startswith("data: "):
                      try:
                          messages.append(json.loads(line[6:]))
                      except json.JSONDecodeError:
                          pass
          results = [m.get("result") for m in messages if isinstance(m, dict) and m.get("id") == 2]
          if not results or not isinstance(results[0], dict) or not isinstance(results[0].get("tools"), list):
              print("FAIL: No valid MCP tools/list response; content withheld.")
              sys.exit(1)
          names = [t.get("name", "") for t in results[0]["tools"] if isinstance(t, dict)]
          print("PASS: MCP tools/list returned", len(names), "tools.")
          for name in sorted(names):
              if name.startswith(("list_", "get_")):
                  print("Read-only candidate:", name)
          PY

      - name: Read bot inventory safely (no secrets or configuration output)
        shell: bash
        env:
          FADEHOST_TOKEN: ${{ secrets.FADEHOST_TOKEN }}
        run: |
          set -euo pipefail
          tools_file="$(mktemp)"
          result_file="$(mktemp)"
          trap 'rm -f "$tools_file" "$result_file"' EXIT
          curl --fail --silent --show-error --max-time 25 --output "$tools_file" \
            --request POST 'https://api.fadehost.com/mcp' \
            --header "Authorization: Bearer ${FADEHOST_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          python3 - "$tools_file" <<'PY'
          import json,sys
          body=open(sys.argv[1],encoding="utf-8").read()
          events=[]
          try: events=[json.loads(body)]
          except json.JSONDecodeError:
              for line in body.splitlines():
                  if line.startswith("data: "):
                      try: events.append(json.loads(line[6:]))
                      except json.JSONDecodeError: pass
          tools=[t for e in events if isinstance(e,dict) for t in e.get("result",{}).get("tools",[]) if t.get("name")=="list_bots"]
          if len(tools)!=1:
              print("FAIL: list_bots tool unavailable");sys.exit(1)
          required=tools[0].get("inputSchema",{}).get("required",[])
          if required:
              print("SKIP: list_bots requires arguments; no automatic call made.")
              sys.exit(0)
          print("PASS: list_bots accepts an empty argument object.")
          for candidate in ("list_app_deployments","get_bot_logs","get_live_stats"):
              matches=[t for e in events if isinstance(e,dict) for t in e.get("result",{}).get("tools",[]) if t.get("name")==candidate]
              if matches:
                  schema=matches[0].get("inputSchema",{})
                  print("READ-ONLY TOOL SCHEMA:",candidate,"required:",schema.get("required",[]),"properties:",sorted(schema.get("properties",{}).keys()))
                  for key, spec in schema.get("properties",{}).items():
                      if isinstance(spec,dict):
                          print("TOOL ARGUMENT:",candidate,key,"type:",spec.get("type"),"description:",str(spec.get("description",""))[:180])
          PY
          curl --fail --silent --show-error --max-time 25 --output "$result_file" \
            --request POST 'https://api.fadehost.com/mcp' \
            --header "Authorization: Bearer ${FADEHOST_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_bots","arguments":{}}}'
          python3 - "$result_file" <<'PY'
          import json,sys
          body=open(sys.argv[1],encoding="utf-8").read()
          events=[]
          try: events=[json.loads(body)]
          except json.JSONDecodeError:
              for line in body.splitlines():
                  if line.startswith("data: "):
                      try: events.append(json.loads(line[6:]))
                      except json.JSONDecodeError: pass
          matches=[e for e in events if isinstance(e,dict) and e.get("id")==3]
          if not matches or "error" in matches[0] or matches[0].get("result",{}).get("isError"):
              print("FAIL: list_bots call returned an error (details withheld).");sys.exit(1)
          result=matches[0].get("result",{})
          payloads=[]
          for item in result.get("content",[]):
              if item.get("type")=="text":
                  try: payloads.append(json.loads(item.get("text","")))
                  except json.JSONDecodeError: pass
          if isinstance(result.get("structuredContent"), (dict,list)):
              payloads.append(result["structuredContent"])
          if not payloads:
              print("DIAGNOSTIC: MCP response envelope keys:", sorted(result.keys()))
              print("DIAGNOSTIC: MCP content types:", [item.get("type") for item in result.get("content",[]) if isinstance(item,dict)])
              print("DIAGNOSTIC: MCP structuredContent present:", "structuredContent" in result)
              print("DIAGNOSTIC: MCP tool isError:", result.get("isError",False))
              print("PASS: list_bots MCP call completed; inventory structure not recognized.")
              sys.exit(0)
          def scan(value):
              if isinstance(value,list):
                  for v in value: scan(v)
              elif isinstance(value,dict):
                  if value.get("name")=="telegram-bot":
                      print("PROFINO bot found: yes")
                      print("PROFINO bot field names:", sorted(value.keys()))
                      for key in ("status","state","power_state"):
                          if isinstance(value.get(key),str) and value[key] in ("running","online","offline","stopped","starting","sleeping","error"):
                              print("PROFINO bot",key+":",value[key])
                  for key in ("bots","data","items","results"):
                      if key in value: scan(value[key])
          print("DIAGNOSTIC: inventory parsed payload types:", [type(x).__name__ for x in payloads])
          for payload in payloads:
              if isinstance(payload,dict):
                  print("DIAGNOSTIC: inventory top-level keys:", sorted(payload.keys()))
          scan(payloads)
          print("PASS: list_bots read-only request completed; sensitive fields withheld.")
          PY


      - name: Audit FadeHost permissions and PROFINO deployment (read-only)
        shell: bash
        env:
          FADEHOST_TOKEN: ${{ secrets.FADEHOST_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          endpoint="https://api.fadehost.com/mcp"
          token=os.environ["FADEHOST_TOKEN"]
          def rpc(method,params,ident):
              body=json.dumps({"jsonrpc":"2.0","id":ident,"method":method,"params":params})
              p=subprocess.run(["curl","--silent","--show-error","--max-time","25","--request","POST",endpoint,
                  "--header","Authorization: Bearer "+token,"--header","Content-Type: application/json",
                  "--header","Accept: application/json, text/event-stream","--data-binary","@-"],
                  input=body,text=True,capture_output=True,timeout=30)
              if p.returncode:
                  print("FAIL: MCP transport error (details withheld)");sys.exit(1)
              try: events=[json.loads(p.stdout)]
              except json.JSONDecodeError:
                  events=[]
                  for line in p.stdout.splitlines():
                      if line.startswith("data: "):
                          try: events.append(json.loads(line[6:]))
                          except json.JSONDecodeError: pass
              matches=[e for e in events if isinstance(e,dict) and e.get("id")==ident]
              if not matches or "error" in matches[0]:
                  print("FAIL: MCP response error (details withheld)");sys.exit(1)
              return matches[0].get("result",{})
          def call(name,args,ident):
              result=rpc("tools/call",{"name":name,"arguments":args},ident)
              if result.get("isError"):
                  print("SKIP:",name,"returned an application error (details withheld)")
                  return None
              payload=result.get("structuredContent")
              if payload is None:
                  for item in result.get("content",[]):
                      if item.get("type")=="text":
                          try: payload=json.loads(item.get("text",""))
                          except json.JSONDecodeError: pass
              return payload
          tools=rpc("tools/list",{},20).get("tools",[])
          names={t.get("name") for t in tools}
          print("MCP available tool count:",len(names))
          for t in tools:
              n=t.get("name","")
              if any(word in n for word in ("database","network","private","postgres","bot","app","server","vps")):
                  schema=t.get("inputSchema",{})
                  print("Relevant tool:",n,"required:",schema.get("required",[]))
          inventory=call("list_bots",{},21)
          bots=inventory.get("bots",[]) if isinstance(inventory,dict) else inventory if isinstance(inventory,list) else []
          matches=[b for b in bots if isinstance(b,dict) and b.get("name")=="telegram-bot"]
          if not matches:
              print("FAIL: PROFINO bot not found in inventory");sys.exit(1)
          bot=matches[0]
          print("PROFINO bot found: yes")
          print("PROFINO bot status:",bot.get("status","unknown"))
          bot_id=bot.get("id")
          if not isinstance(bot_id,str) or not bot_id.startswith("bot_"):
              print("FAIL: PROFINO internal ID missing");sys.exit(1)
          print("PROFINO internal bot ID verified: yes (value withheld)")
          deployments=call("list_app_deployments",{"app":bot_id},22)
          if deployments is not None:
              print("PASS: deployment query authorized")
              if isinstance(deployments,dict):
                  print("Deployment result keys:",sorted(deployments.keys()))
                  for k in ("deployments","items","data","results"):
                      if isinstance(deployments.get(k),list):
                          print("Deployment record count:",len(deployments[k]))
                          for item in deployments[k][:3]:
                              if isinstance(item,dict):
                                  for field in ("status","state"):
                                      if isinstance(item.get(field),str):
                                          print("Deployment",field+":",item[field][:50])
              elif isinstance(deployments,list):
                  print("Deployment record count:",len(deployments))
          for tool in ("list_servers","list_vps"):
              if tool in names:
                  result=call(tool,{},23 if tool=="list_servers" else 24)
                  print("Read-only inventory",tool,"available:",result is not None)
                  if isinstance(result,dict):
                      print("Inventory",tool,"top-level keys:",sorted(result.keys()))
          PY
