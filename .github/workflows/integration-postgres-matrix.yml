name: Integration PostgreSQL financial test matrix

on:
  push:
    branches:
      - feature/integrated-postgres-matrix
  pull_request:
    branches:
      - feature/simulated-deposit-wallet
      - feature/integrated-postgres-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/profino_test
      PROFINO_DISPOSABLE_POSTGRES: 'yes'
      CATALOG_REHEARSAL_URL: postgres://postgres:postgres@localhost:5432/catalog_rehearsal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax validation
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Create isolated catalog migration rehearsal database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE catalog_rehearsal'
      - name: Unit and PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --test-reporter=tap | tee "$RUNNER_TEMP/profino-matrix.tap"
          node scripts/verify-financial-test-evidence.js "$RUNNER_TEMP/profino-matrix.tap" --full
      - name: Reset disposable databases before focused PostgreSQL tests
        if: matrix.node-version == 22
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Only fixed disposable localhost CI databases; never use a production URL.
          for db in profino_test catalog_rehearsal; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS $db WITH (FORCE)"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE $db"
          done
      - name: Focused PostgreSQL tests
        if: matrix.node-version == 22
        shell: bash
        run: |
          set -euo pipefail
          npm run pretest:postgres
          node --test --test-reporter=tap src/*.postgres.test.js | tee "$RUNNER_TEMP/profino-focused.tap"
          node scripts/verify-financial-test-evidence.js "$RUNNER_TEMP/profino-focused.tap"
      - name: Restore and replay synthetic wallet activity on PostgreSQL 17
        if: matrix.node-version == 22
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" createdb -U postgres wallet_drill_source
          docker exec "$PG_CONTAINER" createdb -U postgres wallet_drill_restored
          node scripts/check-wallet-restore.js seed > "$RUNNER_TEMP/wallet-source.json"
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc wallet_drill_source |
            docker exec -i "$PG_CONTAINER" pg_restore -U postgres --single-transaction --exit-on-error -d wallet_drill_restored
          node scripts/check-wallet-restore.js verify > "$RUNNER_TEMP/wallet-restored.json"
          cmp "$RUNNER_TEMP/wallet-source.json" "$RUNNER_TEMP/wallet-restored.json"
          # Compare both catalogs in pg_restore form. PostgreSQL can rewrite equivalent CHECK casts during restore.
          docker exec "$PG_CONTAINER" createdb -U postgres wallet_schema_reference
          docker exec "$PG_CONTAINER" pg_dump -U postgres --schema-only -Fc wallet_drill_source |
            docker exec -i "$PG_CONTAINER" pg_restore -U postgres --single-transaction --exit-on-error -d wallet_schema_reference
          for db in wallet_drill_source wallet_schema_reference wallet_drill_restored; do
            docker exec -i "$PG_CONTAINER" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -d "$db" \
              < scripts/ledger-catalog.sql > "$RUNNER_TEMP/$db.catalog"
          done
          test "$(grep -c '^\["table",' "$RUNNER_TEMP/wallet_schema_reference.catalog")" -eq 3
          diff -u "$RUNNER_TEMP/wallet_schema_reference.catalog" "$RUNNER_TEMP/wallet_drill_restored.catalog"
          node scripts/build-ledger-comparison.mjs "$RUNNER_TEMP/wallet_drill_source.catalog" "$RUNNER_TEMP/wallet_schema_reference.catalog" "$RUNNER_TEMP/compare-ledger.sql"
          for db in wallet_drill_source wallet_drill_restored; do
            docker exec -i "$PG_CONTAINER" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -d "$db" \
              < "$RUNNER_TEMP/compare-ledger.sql" > "$RUNNER_TEMP/comparison.txt"
            grep -Fxq 'ledger|three tables|match' "$RUNNER_TEMP/comparison.txt"
          done
          docker exec "$PG_CONTAINER" psql -Xq -v ON_ERROR_STOP=1 -U postgres -d wallet_drill_restored \
            -c 'ALTER TABLE ledger_entries DISABLE TRIGGER protect_posted_ledger_entries'
          docker exec -i "$PG_CONTAINER" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -d wallet_drill_restored \
            < scripts/ledger-catalog.sql > "$RUNNER_TEMP/disabled.catalog"
          if cmp -s "$RUNNER_TEMP/wallet_schema_reference.catalog" "$RUNNER_TEMP/disabled.catalog"; then
            echo "Disabled ledger trigger went undetected" >&2
            exit 1
          fi
          docker exec -i "$PG_CONTAINER" psql -XqAt -v ON_ERROR_STOP=1 -U postgres -d wallet_drill_restored \
            < "$RUNNER_TEMP/compare-ledger.sql" > "$RUNNER_TEMP/comparison.txt"
          test "$(cat "$RUNNER_TEMP/comparison.txt")" = 'trigger|ledger_entries.protect_posted_ledger_entries|changed'
          echo "Ledger catalog matches after restore and detects a disabled trigger."
