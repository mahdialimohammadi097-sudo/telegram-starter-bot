name: Integration PostgreSQL financial test matrix

on:
  push:
    branches:
      - feature/integrated-postgres-matrix
  pull_request:
    branches:
      - feature/simulated-deposit-wallet
      - feature/integrated-postgres-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/profino_test
      PROFINO_DISPOSABLE_POSTGRES: 'yes'
      CATALOG_REHEARSAL_URL: postgres://postgres:postgres@localhost:5432/catalog_rehearsal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax validation
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Create isolated catalog migration rehearsal database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE catalog_rehearsal'
      - name: Unit and PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --test-reporter=tap | tee "$RUNNER_TEMP/profino-matrix.tap"
          grep -Eq '^# tests [1-9][0-9]*
      - name: Reset isolated catalog database before focused PostgreSQL tests
        if: matrix.node-version == 22
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE catalog_rehearsal WITH (FORCE)'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE catalog_rehearsal'
      - name: Focused PostgreSQL tests
        if: matrix.node-version == 22
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap src/*.postgres.test.js | tee "$RUNNER_TEMP/profino-focused.tap"
          grep -Eq '^# tests [1-9][0-9]*
 "$RUNNER_TEMP/profino-matrix.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/profino-matrix.tap"
      - name: Reset isolated catalog database before focused PostgreSQL tests
        if: matrix.node-version == 22
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE catalog_rehearsal WITH (FORCE)'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE catalog_rehearsal'
      - name: Focused PostgreSQL tests
        if: matrix.node-version == 22
        run: npm run test:postgres
 "$RUNNER_TEMP/profino-focused.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/profino-focused.tap"
 "$RUNNER_TEMP/profino-matrix.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/profino-matrix.tap"
      - name: Reset isolated catalog database before focused PostgreSQL tests
        if: matrix.node-version == 22
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE catalog_rehearsal WITH (FORCE)'
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE catalog_rehearsal'
      - name: Focused PostgreSQL tests
        if: matrix.node-version == 22
        run: npm run test:postgres
