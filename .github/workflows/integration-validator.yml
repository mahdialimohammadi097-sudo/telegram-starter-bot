name: Integration ledger validator regression

on:
  push:
    branches:
      - integration/retain-ledger-validator-20261120
  pull_request:
    branches:
      - feature/integrated-postgres-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify diagnostic source and test syntax
        run: |
          node --check src/database-diagnostics.js
          node --check src/database-diagnostics.test.js
      - name: Run delegated ledger validator regression tests
        run: node --test src/database-diagnostics.test.js

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/profino_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Unit and PostgreSQL integration tests
        run: npm test
      - name: Focused PostgreSQL tests
        run: npm run test:postgres
