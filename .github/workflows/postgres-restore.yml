name: PostgreSQL 17 restore drill

on:
  push:
    branches: [feature/integrated-postgres-matrix]
    paths:
      - .github/workflows/postgres-restore.yml
      - scripts/test-postgres-restore.sh
      - src/admin-ops.js
      - src/post-history.js
  pull_request:
    paths:
      - .github/workflows/postgres-restore.yml
      - scripts/test-postgres-restore.sh
      - src/admin-ops.js
      - src/post-history.js
      - src/database.js
      - package*.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run synthetic dump and restore on PostgreSQL 17
        run: |
          docker run --rm --network none --user postgres \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$(realpath "$(command -v node)"):/usr/local/bin/node:ro" \
            --workdir /work postgres:17-bookworm bash scripts/test-postgres-restore.sh
