name: Security credential scan

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'security/**'
  pull_request:
    branches:
      - main
      - feature/integrated-postgres-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject tracked credential and backup filenames
        run: node scripts/check-sensitive-paths.js
      - name: Scan tracked text for credential patterns
        run: node scripts/check-secret-patterns.js
      - name: Scan reachable Git history for credential patterns
        run: node scripts/check-secret-history.js
      - name: Run credential policy regression tests
        run: node --test scripts/check-sensitive-paths.test.js scripts/check-secret-patterns.test.js scripts/check-secret-history.test.js
