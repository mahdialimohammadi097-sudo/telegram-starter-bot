name: Catalog ownership tests
on:
  # Release checks must report on every PR, including transitive changes.
  pull_request:
  push:
    branches:
      - feature/catalog-owner-adapter
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/audit-deposit-schema.js
      - run: node --test src/catalog-deposit-owner.test.js src/deposit-owner-guard.test.js src/deposit-historical-wallet-db-inspection.test.js src/deposit-historical-wallet-record.test.js src/read-only-deposit-audit.test.js src/verified-deposit-evidence-store.test.js src/bep20-receipt-evidence.test.js src/bep20-deposit-observation.test.js src/bep20-deposit-rehearsal.test.js src/bep20-rpc-reader.test.js src/deposit-schema-audit.test.js src/deposit-ingestion-gate.test.js src/confirmed-deposit-posting.test.js
