name: Validate JavaScript

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} / PostgreSQL 17
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/profino_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Run unit and PostgreSQL 17 integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --test-reporter=tap | tee "$RUNNER_TEMP/profino-tests.tap"
          grep -Eq '^# tests [1-9][0-9]*$' "$RUNNER_TEMP/profino-tests.tap"
          grep -Fxq '# skipped 0' "$RUNNER_TEMP/profino-tests.tap"
          {
            echo "### Node.js ${{ matrix.node-version }} / PostgreSQL 17"
            echo "Commit: $GITHUB_SHA"
            echo '~~~text'
            grep -E '^# (tests|pass|fail|skipped) [0-9]+$' "$RUNNER_TEMP/profino-tests.tap"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the focused PostgreSQL review command
        if: matrix.node-version == 22
        run: npm run test:postgres
      - name: Restore and replay synthetic wallet activity on PostgreSQL 17
        if: matrix.node-version == 22
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" createdb -U postgres wallet_drill_source
          docker exec "$PG_CONTAINER" createdb -U postgres wallet_drill_restored
          node scripts/check-wallet-restore.js seed > "$RUNNER_TEMP/wallet-source.json"
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc wallet_drill_source |
            docker exec -i "$PG_CONTAINER" pg_restore -U postgres --single-transaction --exit-on-error -d wallet_drill_restored
          node scripts/check-wallet-restore.js verify > "$RUNNER_TEMP/wallet-restored.json"
          cmp "$RUNNER_TEMP/wallet-source.json" "$RUNNER_TEMP/wallet-restored.json"
