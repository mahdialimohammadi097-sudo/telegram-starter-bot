name: Validate JavaScript

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  syntax:
    name: JavaScript syntax and PostgreSQL 17 tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/profino_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Run unit and PostgreSQL 17 integration tests
        run: npm test
